<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مهامي</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <header>
      <h1>مهامي</h1>
      <p id="count"></p>
    </header>

    <form id="form">
      <input id="title" placeholder="ما المهمة التالية؟" maxlength="200" required>
      <select id="priority" aria-label="الأولوية">
        <option value="low">أولوية منخفضة</option>
        <option value="medium" selected>أولوية متوسطة</option>
        <option value="high">أولوية عالية</option>
      </select>
      <input id="due" type="date" aria-label="الموعد">
      <button type="submit">إضافة مهمة</button>
    </form>

    <nav id="filters">
      <button data-f="all" class="on">الكل</button>
      <button data-f="todo">للتنفيذ</button>
      <button data-f="doing">قيد العمل</button>
      <button data-f="done">مكتملة</button>
    </nav>

    <p id="error" role="alert" hidden></p>
    <ul id="list"></ul>
    <p id="empty" hidden>لا توجد مهام هنا. أضف مهمتك الأولى من الأعلى.</p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
